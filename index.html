<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QAOO AI - Beyond Human Imagination</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  min-height: 100vh;
}

header {
  padding: 20px;
  border-bottom: 1px solid #334155;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #38bdf8;
}

.badge {
  color: #4ade80;
  font-size: 13px;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 30px 18px;
}

.welcome {
  text-align: center;
  margin: 60px 0 35px;
}

.welcome h1 {
  font-size: 42px;
  color: #38bdf8;
}

.welcome p {
  color: #94a3b8;
}

#chat {
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding-bottom: 20px;
}

.message {
  padding: 15px;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #0369a1;
  align-self: flex-end;
}

.ai {
  background: #1e293b;
  align-self: flex-start;
}

.input-area {
  position: sticky;
  bottom: 0;
  background: #0f172a;
  padding: 15px 0;
  display: flex;
  gap: 10px;
}

textarea {
  flex: 1;
  resize: none;
  min-height: 55px;
  max-height: 130px;
  border: 1px solid #475569;
  border-radius: 12px;
  padding: 15px;
  background: #1e293b;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  background: #0284c7;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 0 22px;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

footer {
  text-align: center;
  padding: 20px;
  color: #64748b;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">QAOO AI</div>
  <div class="badge">● AI Assistant</div>
</header>

<main>

<section class="welcome" id="welcome">
  <h1>QAOO AI</h1>
  <p>Beyond Human Imagination</p>
  <p>Your intelligent AI assistant. Ask me anything!</p>
</section>

<div id="chat"></div>

<div class="input-area">
  <textarea
    id="prompt"
    placeholder="Ask QAOO AI anything..."
    rows="1"
  ></textarea>
  <button id="send" onclick="sendMessage()">Send</button>
</div>

</main>

<footer>
  © 2026 QAOO AI. All rights reserved.
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("prompt");
const sendButton = document.getElementById("send");

let messages = [];

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

  return div;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sendButton.disabled) return;

  document.getElementById("welcome").style.display = "none";

  addMessage(text, "user");

  messages.push({
    role: "user",
    content: text
  });

  input.value = "";
  sendButton.disabled = true;

  const loading = addMessage("QAOO AI is thinking...", "ai");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Something went wrong.");
    }

    loading.textContent = data.reply;

    messages.push({
      role: "assistant",
      content: data.reply
    });

  } catch (error) {
    loading.textContent = "Sorry! " + error.message;
  }

  sendButton.disabled = false;
  input.focus();
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
